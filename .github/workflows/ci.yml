name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支并发触发时取消旧的，节省 minutes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 / macos-15 = Apple Silicon runners
        # ubuntu 用来验证非 macOS 的 ONNX/jieba 二进制能正常解析
        os: [macos-14, ubuntu-latest]
        # 22：服务器版（Docker 镜像）跑在 Node 22 上，pdf.js 用到 Promise.withResolvers（Node 20 没有）
        node: ['22']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 单元测试不需要 better-sqlite3 native rebuild，
      # 用 --ignore-scripts 大幅缩短 install 时间并绕开 node-gyp 在 CI 上的不稳定
      - name: Install (skip native build)
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      # --ignore-scripts 也跳过了 ffmpeg-static 的下载；视频相关测试要真的 ffmpeg 二进制
      - name: Fetch ffmpeg binary
        run: node node_modules/ffmpeg-static/install.js

      - name: Typecheck
        run: npm run typecheck
        # 该项目的根 tsconfig 用复合项目引用，存在已知 TS6310 + window.api
        # 全局声明问题，归类为"不阻塞测试"。下面的 vitest 是真正的回归门。
        continue-on-error: true

      - name: Unit tests
        run: npm test
