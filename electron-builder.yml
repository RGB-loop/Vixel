appId: com.vixel.app
productName: Vixel
copyright: Copyright 2026 Vixel Team
directories:
  buildResources: resources
  output: release
files:
  - '!**/.vscode/*'
  - '!**/.github/*'
  - '!**/*.test.{ts,tsx,js}'
  - '!**/*.spec.{ts,tsx,js}'
  - '!src/*'
  - '!scripts/*'
  - '!docs/**'
  - '!vitest.config.*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.cli.json}'
  - '!{Vixel_PRD.md,Vixel_Tech.md,SKILL.md}'
  # 构建产物 / 模型 / 原生运行时都不进 asar：模型和 LiteRT 走 extraResources，dist 是 CLI，release 是上一次的打包输出
  # 注意：不要在 mac: / win: 下写 files —— 平台级 files 会整个替换这里的列表，上面的排除全部失效
  - '!{release,dist,resources}/**'
  # 本地工作目录：worktree（含整份源码和资源副本）、server 的 Node ABI 依赖、自定义网页构建、测试输出
  - '!{.claude,.git,server,e2e-out,coverage}/**'
  # onnxruntime-node（人脸 / OCR）自带全部平台的二进制，只留目标平台的
  - '!node_modules/onnxruntime-node/bin/napi-v*/!(${platform})/**'
asar: true
afterPack: build/adhoc-sign.cjs
# 深链接（vixel://open?…，见 src/shared/deeplink.ts）：注册成系统级 URL scheme，
# 笔记里的链接能直接拉起 / 聚焦 Vixel（macOS 写进 Info.plist 的 CFBundleURLTypes，Windows 写注册表）
protocols:
  - name: Vixel Deep Link
    schemes:
      - vixel
# asarIntegrity: 防止打包后 asar 被替换；Electron 启动时校验摘要
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
  - node_modules/sharp/**
  - node_modules/onnxruntime-node/**
  - node_modules/sqlite-vec/**
  # sqlite-vec 的 .dylib 在平台子包里（sqlite-vec-darwin-arm64 等），原生 dlopen 读不了 asar 里的文件
  - node_modules/sqlite-vec-*/**
  - node_modules/@node-rs/jieba*/**
  # koffi（加载 LiteRT-LM 的 FFI）：原生 .node 不能从 asar 里加载
  - node_modules/koffi/**
# 本地模型作为 extraResources（运行时通过 process.resourcesPath 访问）
extraResources:
  - from: resources/models
    to: models
    filter:
      - '**/*'
      - '!gemma2/**'   # 旧 ONNX 模型（开发机上可能还留着），已由 LiteRT 取代
      - '!**/*_cache*' # LiteRT GPU / XNNPACK 缓存：运行时写到 <userData>/litert-cache，不该进安装包
  # LiteRT-LM 原生库：只带目标平台那一份（npm run models:download 按平台解压到这里）
  - from: resources/litert/${platform}-${arch}
    to: litert
  # 网页前端（本地接口的浏览器界面；prepackage 跑 npm run build:web 保证它存在）
  - from: dist/web
    to: web

mac:
  icon: build/icon.icns
  category: public.app-category.photography
  # 加固运行时 + 自定义 entitlements；JIT/V8 + .node 加载所需
  # 没有 Developer ID 证书：不走证书签名（null = 不去钥匙串里乱找证书），
  # 由 afterPack 的 build/adhoc-sign.cjs 做 ad-hoc 签名。有证书后删掉这一行即可走正式签名。
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 系统授权弹窗文案：说明用途 + 只读 + 不上传（用户第一次添加这些位置的文件夹时出现）
  extendInfo:
    NSDesktopFolderUsageDescription: Vixel 只读访问你添加的文件夹，在本机为其中的照片和视频建立索引，不会修改或上传任何文件。
    NSDocumentsFolderUsageDescription: Vixel 只读访问你添加的文件夹，在本机为其中的照片和视频建立索引，不会修改或上传任何文件。
    NSDownloadsFolderUsageDescription: Vixel 只读访问你添加的文件夹，在本机为其中的照片和视频建立索引，不会修改或上传任何文件。
    NSRemovableVolumesUsageDescription: Vixel 只读访问移动硬盘上你添加的文件夹，在本机建立索引，不会修改或上传任何文件。
    NSNetworkVolumesUsageDescription: Vixel 只读访问网络磁盘上你添加的文件夹，在本机建立索引，不会修改或上传任何文件。
    NSMicrophoneUsageDescription: Vixel 使用麦克风接收语音搜索；录音只在本机转写成文字，不会保存、不会上传。
  # 语音转写辅助程序（scripts/build-speech-helper.mjs 编译；没编译出来也不影响打包，语音输入按不可用处理）
  extraResources:
    - from: resources/speech
      to: speech
  # 公证：默认 false（dev / 无证书机器）。CI release 用 CLI override 打开：
  #   electron-builder --mac --c.mac.notarize=true
  # 配合 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 环境变量
  notarize: false
  # 单架构 DMG（按当前 build 机器架构）— CI 上分别跑 arm64/x64
  target:
    - target: dmg
      arch:
        - arm64

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  writeUpdateInfo: false # MVP 阶段未引入 auto-updater，避免误生成

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  maintainer: vixel.com
  category: Graphics
